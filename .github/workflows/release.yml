name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Verify release version
        id: version
        shell: bash
        run: |
          npm run version:check
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Configure Apple signing when available
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [[ -n "$value" ]]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Graft v__VERSION__ — Beta
          releaseBody: Graft is currently in early Beta. See the generated release notes and README for installation and signing status.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: cleanwk/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          sha256="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          VERSION="$VERSION" SHA256="$sha256" ruby -pi -e 'gsub(/^  version .*/, "  version \"#{ENV.fetch("VERSION")}\""); gsub(/^  sha256 .*/, "  sha256 \"#{ENV.fetch("SHA256")}\"")' homebrew-tap/Casks/graft.rb

      - name: Publish Homebrew cask
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/graft.rb
          git diff --cached --quiet && exit 0
          git commit -m "graft ${VERSION}"
          git push
