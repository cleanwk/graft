name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prepare patch version
        id: version
        shell: bash
        run: |
          git fetch origin master --tags

          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${latest_tag}" ]] && git merge-base --is-ancestor "${GITHUB_SHA}" "${latest_tag}"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git pull --rebase origin master
          current="$(node -p "require('./package.json').version")"
          if git rev-parse --verify --quiet "refs/tags/v${current}" >/dev/null; then
            npm run version:bump
          fi
          npm run version:check
          version="$(node -p "require('./package.json').version")"

          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
            git commit -m "release: prepare Graft ${version}"
            git push origin HEAD:master
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.release == 'true'
        with:
          toolchain: 1.92.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.release == 'true'
        with:
          workspaces: src-tauri
      - run: npm ci
        if: steps.version.outputs.release == 'true'

      - name: Configure Apple signing when available
        if: steps.version.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [[ -n "$value" ]]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v1
        if: steps.version.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Graft v__VERSION__ — Beta
          releaseBody: Graft is currently in early Beta. See the generated release notes and README for installation and signing status.
          releaseCommitish: ${{ steps.version.outputs.commit }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
